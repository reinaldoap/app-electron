<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Electron App</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="/images/icon.png">
  </head>
  <body>
    <script src="index.js"></script>

    <div class="app">
        <div class="sidebar">
            <!-- Seção do usuário -->
            <div class="user-section">
                <img src="https://i.pravatar.cc/150?img=3" alt="Usuário">
                <div class="user-info">
                    <div class="name">Reinaldo Filho</div>
                    <div class="role">Administrador</div>
                </div>
            </div>

            <!-- Menu -->
            <div class="menu">
                <div class="menu-item active">Dashboard</div>
                <div class="menu-item">Relatórios</div>
                <div class="menu-item">Usuários</div>
                <div class="menu-item">Configurações</div>
            </div>
            
        </div>
        <div class="content">
            <h1>Conteúdo principal</h1>
            <p>
                Essa área cresce e se ajusta ao tamanho da tela.<br/>
                <h1 id="message">Carregando... olá mundo cruel!</h1>
            </p>
        </div>
    </div>

  </body>
</html>
